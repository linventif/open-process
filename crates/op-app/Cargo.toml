[package]
name = "op-app"
description = "Open Process – BPMN & Petri net modeler (native + web)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "open-process"
path = "src/main.rs"

[dependencies]
op-core = { path = "../op-core" }
serde.workspace = true
serde_json.workspace = true
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
eframe = { version = "0.37", features = ["persistence"] }
log = "0.4"
rfd = { version = "0.18", features = ["file-handle-inner"] }
egui_tiles = "0.18"
image = { version = "0.25", default-features = false, features = ["png"] }
resvg = { version = "0.47", default-features = false, features = ["text"] }
# Stable identities keep automatic copies separate, including documents with the same name.
uuid = { version = "1", features = ["v4", "js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"
# Stages and atomically replaces native saves, including Windows overwrites.
tempfile = "3.27"
# Resolve redirected Documents folders and XDG user directories through platform APIs.
directories = "6"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement", "HtmlAnchorElement", "Blob", "BlobPropertyBag", "Url", "Storage"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
egui_kittest = { version = "0.37", features = ["eframe", "wgpu", "snapshot"] }
