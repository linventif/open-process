<!doctype html>
<meta charset="utf-8">
<title>Open Process analysis worker smoke test</title>
<pre id="result">Testing the compiled analysis worker…</pre>
<script type="module">
const report = {};
try {
    const index = new DOMParser().parseFromString(await (await fetch('./index.html')).text(), 'text/html');
    const asset = selector => new URL(index.querySelector(selector).getAttribute('href'), location.href);
    const glue = asset('link[rel="modulepreload"]');
    const wasm = asset('link[rel="preload"][type="application/wasm"]');
    for (const [rel, url] of [['modulepreload',glue],['preload',wasm]]) {
        const link = document.createElement('link');
        link.rel=rel; link.href=url;
        if (rel==='preload') { link.type='application/wasm'; link.as='fetch'; }
        document.head.append(link);
    }
    const source = await (await fetch(glue)).text();
    const snippet = source.match(/import\s+\{[^}]*\bstart_analysis_job\b[^}]*\}\s+from\s+['"]([^'"]+)['"]/);
    if (!snippet) throw new Error('Analysis transport import not found in Trunk glue');
    const {start_analysis_job, cancel_analysis_job} = await import(new URL(snippet[1],glue));
    const net = {
        name:'Worker smoke test', next_id:6,
        places:[{id:1,name:'in',tokens:1,pos:{x:0,y:0}},{id:2,name:'out',tokens:0,pos:{x:100,y:0}}],
        transitions:[{id:3,name:'work',pos:{x:50,y:0}}],
        arcs:[{id:4,from:{Place:1},to:{Transition:3},weight:1},{id:5,from:{Transition:3},to:{Place:2},weight:1}]
    };
    const input=JSON.stringify({net,limit:5000,lang:'En'});
    let ticks=0;
    const timer=setInterval(()=>ticks++,10);
    const started=performance.now();
    const run=input=>new Promise((resolve,reject)=>{
        const deadline=setTimeout(()=>reject(new Error('Worker timeout')),25000);
        start_analysis_job(input,raw=>{clearTimeout(deadline);resolve(JSON.parse(raw));});
    });
    const response=await run(input);
    clearInterval(timer);
    if(response.error) throw new Error(response.error);
    const analysis=JSON.parse(response.ok);
    if(analysis.ss.states.length!==2 || analysis.sound!=='Sound') throw new Error('Unexpected analysis result');
    report.analysis={states:analysis.ss.states.length,ui_ticks:ticks,ms:Math.round(performance.now()-started)};
    const mermaid=await run(JSON.stringify({task:'mermaid.preview',source:'flowchart TD\n A[Start] --> B[End]\n'}));
    if(mermaid.error) throw new Error(mermaid.error);
    const preview=JSON.parse(mermaid.ok);
    if(!preview.svg.includes('<svg') || preview.png[0]!==137 || preview.png[1]!==80) throw new Error('Invalid Mermaid preview');
    report.mermaid=true;
    const mining=await run(JSON.stringify({task:'mining.discovery',text:'ABCD\nACBD\nAED',lang:'En'}));
    if(mining.error) throw new Error(mining.error);
    const discovery=JSON.parse(mining.ok);
    if(!discovery.result.Ok || discovery.result.Ok[1].footprint.activities.length!==5) throw new Error('Invalid discovery result');
    report.mining=true;
    const diagram={name:'Worker evaluation',next_id:6,pools:[],nodes:[
        {id:1,kind:{StartEvent:'None'},name:'',pos:{x:0,y:0},w:36,h:36},
        {id:2,kind:{Task:'Abstract'},name:'Work',pos:{x:100,y:0},w:100,h:60,cost:2,duration:3},
        {id:3,kind:{EndEvent:'None'},name:'',pos:{x:200,y:0},w:36,h:36}
    ],flows:[{id:4,kind:'Sequence',from:1,to:2,name:''},{id:5,kind:'Sequence',from:2,to:3,name:''}]};
    const bpmn=await run(JSON.stringify({task:'bpmn.evaluation',diagram,lang:'En'}));
    if(bpmn.error) throw new Error(bpmn.error);
    if(JSON.parse(bpmn.ok).mean_duration!==3) throw new Error('Invalid BPMN evaluation');
    report.bpmn=true;
    let cancelledCalled=false;
    const worker=start_analysis_job(input,()=>cancelledCalled=true);
    cancel_analysis_job(worker);
    await new Promise(resolve=>setTimeout(resolve,150));
    if(cancelledCalled) throw new Error('Cancelled job called back');
    report.cancel=true;
    if(!(await run('invalid JSON')).error) throw new Error('Invalid input did not produce an error');
    if(!(await run(JSON.stringify({task:'unknown'}))).error) throw new Error('Unknown task did not produce an error');
    report.invalid=true;
    report.ok=true;
} catch(error) {
    report.ok=false;
    report.error=String(error.stack || error);
}
document.querySelector('#result').textContent=JSON.stringify(report,null,2);
document.documentElement.dataset.result=report.ok?'pass':'fail';
// Optional same-origin collection for a local headless test server.
if(new URLSearchParams(location.search).has('report')) {
    const token=new URLSearchParams(location.search).get('report') || '';
    await fetch(`/result?token=${encodeURIComponent(token)}`,{method:'POST',body:JSON.stringify(report)});
}
</script>
