<!doctype html>
<meta charset="utf-8">
<title>Open Process automatic storage smoke test</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden}canvas{position:absolute;inset:0;width:100%;height:100%}#result{position:fixed;right:0;bottom:0;pointer-events:none;color:white;background:#222;z-index:5}</style>
<canvas id="the_canvas_id"></canvas>
<div id="loading">Loading the application…</div>
<pre id="result">Checking automatic storage…</pre>
<script type="module">
const prefix='open-process-document-', workspace='open-process-v4';
const report=JSON.parse(sessionStorage.getItem('autosave-smoke-report')||'{}');
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const until=async predicate=>{
    for(let i=0;i<300;i++){if(predicate())return;await wait(50);}
    throw new Error('Timed out: '+predicate.toString()+': '+document.querySelector('#loading')?.textContent);
};
const canvas=document.querySelector('canvas');
async function click(x,y){
    canvas.focus();
    for(const [type,buttons] of [['pointermove',0],['pointerdown',1],['pointerup',0]]){
        canvas.dispatchEvent(new PointerEvent(type,{clientX:x,clientY:y,button:0,buttons,pointerId:1,pointerType:'mouse',bubbles:true}));
        await wait(50);
    }
}
async function key(key,code,ctrlKey=false){
    canvas.dispatchEvent(new KeyboardEvent('keydown',{key,code,ctrlKey,bubbles:true}));
    await wait(80);
    canvas.dispatchEvent(new KeyboardEvent('keyup',{key,code,ctrlKey,bubbles:true}));
    await wait(80);
}
try{
    const stage=sessionStorage.getItem('autosave-smoke-stage');
    if(!stage){
        localStorage.clear();
        report.id=crypto.randomUUID();
        const record={
            entry:{id:report.id,revision:crypto.randomUUID(),name:'Browser automatic copy',kind:'whiteboard',manual_path:null},
            state:{Editable:{kind:'whiteboard',model_version:1,model:{name:'Browser automatic copy',next_id:2,elements:[{
                id:1,kind:'Rectangle',bounds:{x:0,y:0,w:160,h:100},points:[],text:'',
                paint:{stroke:[67,76,94],fill:null,width:2,font_size:20,sketch:true}
            }]}}}
        };
        localStorage.setItem(prefix+report.id,JSON.stringify(record));
    }else{
        // Start a fresh open workspace; the separate diagram library must survive.
        localStorage.removeItem(workspace);
    }
    const index=new DOMParser().parseFromString(await(await fetch('./index.html')).text(),'text/html');
    const asset=selector=>new URL(index.querySelector(selector).getAttribute('href'),location.href);
    const glue=asset('link[rel="modulepreload"]'), wasm=asset('link[rel="preload"][type="application/wasm"]');
    const bindings=await import(glue);
    await bindings.default({module_or_path:wasm});
    await until(()=>!document.querySelector('#loading'));
    await wait(300);
    await click(Math.max(20,(innerWidth-1120)/2)+120,420);
    await until(()=>JSON.parse(localStorage.getItem(workspace)||'{}').archived?.length===1);
    const stored=()=>JSON.parse(localStorage.getItem(prefix+report.id));
    if(stage){
        if(stored().state.Editable.model.elements.length!==1)throw new Error('The latest source was not restored');
        report.reopened=true;
        report.ok=true;
    }else{
        report.opened=true;
        await click(innerWidth*.6,innerHeight*.6);
        await key('a','KeyA',true);
        await key('Delete','Delete');
        window.dispatchEvent(new Event('pagehide'));
        await until(()=>stored().state.Editable.model.elements.length===0);
        report.deletion_saved=true;
        const oldRevision=stored().entry.revision;
        const original=Storage.prototype.setItem;
        Storage.prototype.setItem=function(name,value){
            if(name.startsWith(prefix))throw new DOMException('Simulated full local storage','QuotaExceededError');
            return original.call(this,name,value);
        };
        await key('z','KeyZ',true);
        window.dispatchEvent(new Event('pagehide'));
        await wait(200);
        if(stored().entry.revision!==oldRevision)throw new Error('A failed storage write changed the saved copy');
        if(JSON.parse(localStorage.getItem(workspace)).docs.length!==1)throw new Error('An unconfirmed write was marked as saved');
        report.quota_failure_safe=true;
        Storage.prototype.setItem=original;
        window.dispatchEvent(new Event('pagehide'));
        await until(()=>stored().state.Editable.model.elements.length===1);
        report.retry_saved=true;
        sessionStorage.setItem('autosave-smoke-report',JSON.stringify(report));
        sessionStorage.setItem('autosave-smoke-stage','reload');
        location.reload();
    }
}catch(error){report.error=String(error);report.ok=false;}
if(report.ok!==undefined){
    document.querySelector('#result').textContent=JSON.stringify(report,null,2);
    const token=new URLSearchParams(location.search).get('report');
    if(token)await fetch('/result?token='+encodeURIComponent(token),{method:'POST',body:JSON.stringify(report)});
}
</script>
