<g id="node46" data-name="Recorded sales [source]"><title>Recorded sales [source]</title><desc>Sales fields: Id, StructureId, Pizza Type, Pizza Size, Revenue, Cost, Satisfaction, Weekday, Customer Location, Customer Type. This is a sales record, not proof of a distinct customer or an event-log transaction. Cached Excel values are used; formulas are never executed.</desc>
<path d="M1775 1872V1948A95 12 0 0 0 1965 1948V1872"/><ellipse cx="1870" cy="1872" rx="95" ry="12"/>
<text font-size="12" text-anchor="middle" fill="#243342" stroke="none"><title>Recorded sales [source]</title>
<tspan x="1870" y="1978">Recorded sales</tspan>
<tspan x="1870" y="1993.6">[source]</tspan>
</text>
</g>
<g id="node52" data-name="No delivery is observed in the Counter cases."><title>No delivery is observed in the Counter cases.</title><desc>This role vocabulary is shared with the integrated model. No Counter task is assigned to the delivery lane.</desc>
<path d="M110 1310H100V1460H110" fill="none"/>
<text font-size="12" text-anchor="middle" fill="#243342" stroke="none"><title>No delivery is observed in the Counter cases.</title>
<tspan x="270" y="1381.4">No delivery is observed in the Counter</tspan>
<tspan x="270" y="1397">cases.</tspan>
</text>
</g>
<g id="node53" data-name="* Roles inferred from tasks. People are observed. 5 business events have no actor."><title>* Roles inferred from tasks. People are observed. 5 business events have no actor.</title><desc>William handles intake and Internet approval/contact/modification/cancellation. Patrick and Robert prepare, bake and pack. Jack, Paul, Richard and Harry plan/deliver and settle delivered orders. Counter and pickup settlement is assigned to William. Unknown Counter Prepare actors are retained, not filled from adjacent events.</desc>
<path d="M110 330H100V480H110" fill="none"/>
<text font-size="12" text-anchor="middle" fill="#243342" stroke="none"><title>* Roles inferred from tasks. People are observed. 5 business events have no actor.</title>
<tspan x="270" y="393.6">* Roles inferred from tasks. People are</tspan>
<tspan x="270" y="409.2">observed. 5 business events have no</tspan>
<tspan x="270" y="424.8">actor.</tspan>
</text>
</g>
<g id="node55" data-name="Loops and order flexibility are observed; their business cause and timing are unknown."><title>Loops and order flexibility are observed; their business cause and timing are unknown.</title><desc>Prepare -&gt; Bake -&gt; Pack repeats one to three times in the logs. The model generalizes this as a loop; no defect/rework cause or one-cycle/one-sale equivalence is asserted. Cash and Give order occur in both orders. Logical parallel routing expresses that flexibility, not simultaneous human work. Branch labels are explanatory, not an executable decision engine.</desc>
<path d="M110 820H100V970H110" fill="none"/>
<text font-size="12" text-anchor="middle" fill="#243342" stroke="none"><title>Loops and order flexibility are observed; their business cause and timing are unknown.</title>
<tspan x="270" y="883.6">Loops and order flexibility are</tspan>
<tspan x="270" y="899.19995">observed; their business cause and</tspan>
<tspan x="270" y="914.8">timing are unknown.</tspan>
</text>
</g>
