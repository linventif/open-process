</text>
</g>
<g id="node45" data-name="Price catalogue [source]"><title>Price catalogue [source]</title><desc>PizzasInfo: 18 type/size entries, recorded cost and revenue. Monetary unit is unspecified. The association with settlement describes a proposed information interface, not a recorded data exchange.</desc>
<path d="M1275 1872V1948A95 12 0 0 0 1465 1948V1872"/><ellipse cx="1370" cy="1872" rx="95" ry="12"/>
<text font-size="12" text-anchor="middle" fill="#243342" stroke="none"><title>Price catalogue [source]</title>
