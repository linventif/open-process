<g id="node44" data-name="Pizza type / size [source fields]"><title>Pizza type / size [source fields]</title><desc>The Sales worksheets record Pizza Type and Pizza Size. Using those fields as a preparation specification is an authored information-flow assumption; there is no row-level sales-to-case join.</desc>
