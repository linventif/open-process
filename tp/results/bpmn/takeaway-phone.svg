<g id="node55" data-name="Price catalogue [source]"><title>Price catalogue [source]</title><desc>PizzasInfo: 18 type/size entries, recorded cost and revenue. Monetary unit is unspecified. The association with settlement describes a proposed information interface, not a recorded data exchange.</desc>
<path d="M1865 1822V1898A95 12 0 0 0 2055 1898V1822"/><ellipse cx="1960" cy="1822" rx="95" ry="12"/>
<text font-size="12" text-anchor="middle" fill="#243342" stroke="none"><title>Price catalogue [source]</title>
<tspan x="1960" y="1928">Price catalogue</tspan>
<tspan x="1960" y="1943.6">[source]</tspan>
</text>
</g>
<g id="node56" data-name="Recorded sales [source]"><title>Recorded sales [source]</title><desc>Sales fields: Id, StructureId, Pizza Type, Pizza Size, Revenue, Cost, Satisfaction, Weekday, Customer Location, Customer Type. This is a sales record, not proof of a distinct customer or an event-log transaction. Cached Excel values are used; formulas are never executed.</desc>
<path d="M2365 1822V1898A95 12 0 0 0 2555 1898V1822"/><ellipse cx="2460" cy="1822" rx="95" ry="12"/>
<text font-size="12" text-anchor="middle" fill="#243342" stroke="none"><title>Recorded sales [source]</title>
<tspan x="2460" y="1928">Recorded sales</tspan>
<tspan x="2460" y="1943.6">[source]</tspan>
</text>
</g>
<g id="node57" data-name="Customer location [source field]"><title>Customer location [source field]</title><desc>Customer Location is a geographic category in Sales, not a street address or a case-linked delivery instruction. Its proposed use in planning is an explicit modeling assumption.</desc>
<path d="M175 1310H308L365 1367V1410H175Z"/><path d="M308 1310V1367H365" fill="none"/>
<text font-size="12" text-anchor="middle" fill="#243342" stroke="none"><title>Customer location [source field]</title>
<tspan x="270" y="1428">Customer location</tspan>
<tspan x="270" y="1443.6">[source field]</tspan>
</text>
</g>
<g id="node63" data-name="* Roles inferred from tasks. People are observed. 0 business events have no actor."><title>* Roles inferred from tasks. People are observed. 0 business events have no actor.</title><desc>William handles intake and Internet approval/contact/modification/cancellation. Patrick and Robert prepare, bake and pack. Jack, Paul, Richard and Harry plan/deliver and settle delivered orders. Counter and pickup settlement is assigned to William. Unknown Counter Prepare actors are retained, not filled from adjacent events.</desc>
<path d="M110 330H100V480H110" fill="none"/>
<text font-size="12" text-anchor="middle" fill="#243342" stroke="none"><title>* Roles inferred from tasks. People are observed. 0 business events have no actor.</title>
<tspan x="270" y="393.6">* Roles inferred from tasks. People are</tspan>
<tspan x="270" y="409.2">observed. 0 business events have no</tspan>
<tspan x="270" y="424.8">actor.</tspan>
</text>
</g>
<g id="node65" data-name="Loops and order flexibility are observed; their business cause and timing are unknown."><title>Loops and order flexibility are observed; their business cause and timing are unknown.</title><desc>Prepare -&gt; Bake -&gt; Pack repeats one to three times in the logs. The model generalizes this as a loop; no defect/rework cause or one-cycle/one-sale equivalence is asserted. Cash and Give order occur in both orders. Logical parallel routing expresses that flexibility, not simultaneous human work. Branch labels are explanatory, not an executable decision engine.</desc>
<path d="M110 820H100V970H110" fill="none"/>
<text font-size="12" text-anchor="middle" fill="#243342" stroke="none"><title>Loops and order flexibility are observed; their business cause and timing are unknown.</title>
<tspan x="270" y="883.6">Loops and order flexibility are</tspan>
<tspan x="270" y="899.19995">observed; their business cause and</tspan>
<tspan x="270" y="914.8">timing are unknown.</tspan>
</text>
</g>
