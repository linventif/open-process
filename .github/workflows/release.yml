name: Release binaries

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Tests and web build
    uses: ./.github/workflows/ci.yml

  build:
    name: ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, ext: "" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, ext: ".exe" }
          - { os: macos-latest, target: aarch64-apple-darwin, ext: "" }
          - { os: macos-latest, target: x86_64-apple-darwin, ext: "" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: release-${{ matrix.target }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgtk-3-dev
      - run: cargo build --locked --release -p op-app --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          python scripts/package_release.py --target ${{ matrix.target }} --binary target/${{ matrix.target }}/release/open-process${{ matrix.ext }} --output out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.target }}
          path: out/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: binary-*
          merge-multiple: true
          path: out
      - name: Choose release tag
        id: release
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="main-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate artifact checksums
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          files = sorted(Path("out").glob("open-process-*"))
          assert files, "No release artifacts found"
          Path("out/SHA256SUMS").write_text("".join(
              f"{hashlib.file_digest(path.open('rb'), 'sha256').hexdigest()}  {path.name}\n"
              for path in files
          ), encoding="utf-8")
          PY
      - name: Publish all platform binaries
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          prerelease: ${{ steps.release.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.release.outputs.latest }}
          fail_on_unmatched_files: true
          files: |
            out/SHA256SUMS
            out/open-process-x86_64-pc-windows-msvc.exe
            out/open-process-x86_64-unknown-linux-gnu
            out/open-process-x86_64-unknown-linux-gnu.tar.gz
            out/open-process-aarch64-apple-darwin
            out/open-process-aarch64-apple-darwin.tar.gz
            out/open-process-x86_64-apple-darwin
            out/open-process-x86_64-apple-darwin.tar.gz
