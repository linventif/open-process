name: Bug report
description: Report a reproducible problem, including an incorrect analysis result.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        English and French are welcome. Search existing issues first.
        Reports and attachments are public: remove confidential data.
        For security vulnerabilities, follow [SECURITY.md](https://github.com/linventif/open-process/blob/main/SECURITY.md).
  - type: input
    id: version
    attributes:
      label: Release tag or commit
      description: For the web app, give its URL and the date you encountered the issue if the build is unknown.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and browser
      placeholder: "Windows 11 desktop app, or macOS with Firefox 145"
    validations:
      required: true
  - type: input
    id: component
    attributes:
      label: Notation or component
      placeholder: "BPMN, Petri analysis, UML, database, website…"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Describe the smallest sequence that reproduces the problem.
      placeholder: |
        1. Open an example or the attached model.
        2. Choose…
        3. Observe…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: For an incorrect analysis, explain the expected result and its basis.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the exact error or unexpected result.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Minimal model, screenshots or logs
      description: Optional. Attach a small synthetic example; if the file type is rejected, use a ZIP. Remove sensitive data.
