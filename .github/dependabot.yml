version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: bun
    directory: /website
    schedule:
      interval: weekly
    ignore:
      # TypeScript 6 is kept only to check .astro files; see website/README.md.
      - dependency-name: typescript-6
        update-types: ["version-update:semver-major"]
