[workspace]
resolver = "3"
members = ["crates/op-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.42"

[profile.release]
opt-level = 2
lto = "thin"

# Fast enough debug builds for the UI
[profile.dev.package."*"]
opt-level = 2
